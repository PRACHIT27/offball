# Build the viewer screen and deploy it to Azure Static Web Apps (offball-web) on every push to
# main that touches web/. Needs the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN (a repo admin adds
# it once: az staticwebapp secrets list -n offball-web -g offball-rg --query properties.apiKey -o tsv
# | gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN). Without it the job only builds.
#
# Hardening: actions pinned to commit SHAs; the token is only visible to the step that checks it
# exists and the deploy step, never to the install or build; npm runs no package scripts.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Is the deploy token set?
        id: token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: echo "present=$([ -n "$SWA_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Static Web Apps
        if: github.event_name != 'pull_request' && steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
