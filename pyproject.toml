[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offball-lane1"
version = "0.1.0"
description = "OffBall Lane 1: data ingestion normalizers and merge stage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
control = ["fastapi>=0.110", "uvicorn>=0.29"]
insights = ["agent-framework>=1.23", "mcp>=2.3", "azure-identity>=1.15"]
azure = [
    "azure-identity>=1.15",
    "azure-eventhub>=5.11",
    "azure-eventhub-checkpointstoreblob-aio>=1.1",
    "aiohttp>=3.9",
    "azure-storage-blob>=12.19",
    "azure-cosmos>=4.5",
    "azure-monitor-opentelemetry>=1.6",
]

[tool.setuptools.package-data]
insights = ["prompts/*.md"]

[tool.setuptools.packages.find]
include = ["ingest*", "engine*", "sim*", "insights*", "mcp_stats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: full-match tests (a few seconds each)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
