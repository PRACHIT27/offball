<text x="500" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Demo link, warm until Nov 10</text>
<text x="500" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Testing instructions</text>
</g>
<g stroke="#73726c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="320" y1="78" x2="358" y2="78"/>
