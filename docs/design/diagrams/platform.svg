<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Platform overview</title>
<desc>GitHub holds the repo, Actions, Codespaces and Copilot. azd up with Bicep deploys one Azure resource group per environment in East US 2, containing messaging, compute, data, AI, web, and security and monitoring services. Fabric reads from the pipeline for the dashboard and dataset; judges and viewers use the demo link.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="520" fill="#ffffff"/>
<g font-size="14">
<rect x="40" y="40" width="280" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="180" y="62" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">GitHub</text>
<text x="180" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Repo · Actions · Codespaces · Copilot</text>
<rect x="360" y="40" width="280" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="500" y="62" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">azd up + Bicep</text>
<text x="500" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">One command deploys everything</text>

