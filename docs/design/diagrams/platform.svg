<text x="530" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Blob Storage</text>

<rect x="60" y="290" width="180" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
