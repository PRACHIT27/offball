<text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Functions</text>
<rect x="440" y="190" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="530" y="210" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Data</text>
