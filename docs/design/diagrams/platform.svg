<text x="150" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Event Hubs, Capture</text>
<text x="150" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Schema Registry</text>
