<line x1="560" y1="354" x2="560" y2="382"/>
<line x1="395" y1="440" x2="395" y2="468"/>
<line x1="240" y1="526" x2="240" y2="554"/>
<line x1="395" y1="526" x2="395" y2="554"/>
