<svg xmlns="http://www.w3.org/2000/svg" width="680" height="716" viewBox="0 0 680 716" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Data Ingestion in six standard layers</title>
<desc>Feed A and feed B push into Event Hubs. Event Hubs Capture lands a raw Bronze copy in OneLake. Normalizers translate each feed and send bad records to dead letter; a stateful merge stage cleans the data into Silver, which Metrics, Tactics and Fabric consume.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="716" fill="#ffffff"/>
<g font-size="12" fill="#5F5E5A">
<text x="40" y="68" dominant-baseline="central">Sources</text>
<text x="40" y="154" dominant-baseline="central">Transport</text>
<text x="40" y="240" dominant-baseline="central">Landing</text>
<text x="40" y="370" dominant-baseline="central">Processing</text>
<text x="40" y="498" dominant-baseline="central">Serving</text>
<text x="40" y="584" dominant-baseline="central">Consumers</text>
</g>
<g font-size="14">
<rect x="170" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="270" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Feed A</text>
<text x="270" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Events, pushed</text>
<rect x="420" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="520" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Feed B</text>
<text x="520" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Tracking, pushed</text>

<rect x="170" y="126" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="270" y="144" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">raw-events</text>
<text x="270" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Event Hubs buffer</text>
<rect x="420" y="126" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="520" y="144" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">raw-tracking</text>
<text x="520" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Event Hubs buffer</text>

<rect x="190" y="212" width="410" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="395" y="230" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#633806">Bronze: Event Hubs Capture</text>
<text x="395" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Raw copy in OneLake, never edited</text>

<rect x="170" y="298" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="255" y="316" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Normalizer A</text>
<text x="255" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Stateless</text>
<rect x="360" y="298" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="420" y="316" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Dead letter</text>
<text x="420" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Bad records</text>
<rect x="500" y="298" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="560" y="316" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Normalizer B</text>
<text x="560" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Stateless</text>

<rect x="170" y="384" width="450" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="395" y="402" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Merge stage (via normalized hub)</text>
<text x="395" y="422" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Stateful: dedupe, align, correct, fill gaps</text>

<rect x="170" y="470" width="450" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="395" y="488" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Silver: Cosmos events + OneLake frames</text>
<text x="395" y="508" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Clean, versioned, queryable</text>

<rect x="170" y="556" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="240" y="574" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Metrics</text>
<text x="240" y="594" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Gold stats</text>
<rect x="325" y="556" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="395" y="574" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Tactics</text>
<text x="395" y="594" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Gold tactics</text>
<rect x="480" y="556" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="550" y="574" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Fabric</text>
<text x="550" y="594" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Dashboards</text>

<rect x="40" y="642" width="600" height="44" rx="8" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="340" y="664" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Across all layers: schema registry · monitoring · retries · security · replay</text>
</g>
<g stroke="#73726c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="270" y1="96" x2="270" y2="124"/>
<line x1="520" y1="96" x2="520" y2="124"/>
<line x1="270" y1="182" x2="270" y2="210"/>
<line x1="520" y1="182" x2="520" y2="210"/>
