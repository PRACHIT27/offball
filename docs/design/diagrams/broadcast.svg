<svg xmlns="http://www.w3.org/2000/svg" width="680" height="626" viewBox="0 0 680 626" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Broadcast workflow</title>
<desc>Cues from Metrics and Tactics and captions from Insight Generation go into the cue manager, which logs them in Cosmos and sends them through a PubSub bridge to Web PubSub. Web PubSub pushes to each browser's cue player and to external graphics systems. The producer console shows every cue and can pull one. The browser places cues in four slots.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="626" fill="#ffffff"/>
<g font-size="14">
<rect x="40" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="130" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Metrics cues</text>
<text x="130" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Speeds, pass arcs</text>
<rect x="250" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Tactics cues</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Notes, boards</text>
<rect x="460" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="550" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Insight captions</text>
<text x="550" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Attach to cues</text>

<rect x="200" y="140" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Cue manager</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Versions, corrections, pulls</text>

<rect x="40" y="240" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="120" y="258" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Cosmos: cues</text>
<text x="120" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Full log</text>
<rect x="260" y="240" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">PubSub bridge</text>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Azure Function</text>
<rect x="480" y="240" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="560" y="258" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">Producer console</text>
<text x="560" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Live view, pull</text>

<rect x="240" y="340" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Web PubSub</text>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">One group per match</text>

<rect x="60" y="440" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="185" y="458" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Browser cue player</text>
<text x="185" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Own match clock, slots</text>
<rect x="370" y="440" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="495" y="458" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Graphics systems</text>
<text x="495" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Same cue feed</text>

<rect x="40" y="540" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="105" y="558" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">Pitch overlay</text>
<text x="105" y="578" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">One highlight</text>
<rect x="190" y="540" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="255" y="558" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">Caption bar</text>
<text x="255" y="578" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">One caption</text>
<rect x="340" y="540" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="405" y="558" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">Side panel</text>
<text x="405" y="578" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Charts, maps</text>
<rect x="490" y="540" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="555" y="558" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">Timeline</text>
<text x="555" y="578" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Everything else</text>
</g>
<g stroke="#73726c" stroke-width="1.5" fill="none">
<line x1="185" y1="496" x2="185" y2="518"/>
<line x1="105" y1="518" x2="555" y2="518"/>
</g>
<g stroke="#73726c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<path d="M130 96 L130 118 L280 118 L280 138"/>
<line x1="340" y1="96" x2="340" y2="138"/>
<path d="M550 96 L550 118 L400 118 L400 138"/>
<path d="M240 196 L240 218 L120 218 L120 238"/>
<line x1="340" y1="196" x2="340" y2="238"/>
<path d="M560 240 L560 168 L482 168" marker-start="url(#arrow)"/>
<line x1="340" y1="296" x2="340" y2="338"/>
<path d="M300 396 L300 418 L185 418 L185 438"/>
<path d="M380 396 L380 418 L495 418 L495 438"/>
<line x1="105" y1="518" x2="105" y2="538"/>
<line x1="255" y1="518" x2="255" y2="538"/>
<line x1="405" y1="518" x2="405" y2="538"/>
<line x1="555" y1="518" x2="555" y2="538"/>
</g>
</svg>
