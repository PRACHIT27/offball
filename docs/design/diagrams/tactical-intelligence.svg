<line x1="230" y1="268" x2="243" y2="268"/>
<line x1="340" y1="296" x2="340" y2="338"/>
<path d="M545 196 L545 356 L437 356"/>
<line x1="135" y1="296" x2="135" y2="438"/>
<line x1="340" y1="396" x2="340" y2="438"/>
<path d="M435 384 L545 384 L545 438"/>
</g>
</svg>
