<svg xmlns="http://www.w3.org/2000/svg" width="680" height="526" viewBox="0 0 680 526" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Tactical Intelligence workflow</title>
<desc>Clean data and metric values feed a window processor and a trigger maker, both driven by the match clock. The change detector sends every change to the screen as a note and passes it to the promoter. Promoted changes and crux or scheduled triggers go into a capped trigger buffer that sends triggers to the agents. Snapshots and triggers are stored in Cosmos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="526" fill="#ffffff"/>
<g font-size="14">
<rect x="215" y="40" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#2C2C2A">Clean data + metric values</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">From ingestion and metrics</text>

<rect x="40" y="140" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="135" y="158" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Window processor</text>
<text x="135" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Last 5 min, every 10 s</text>
<rect x="245" y="140" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Match clock</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">10 s · 15 min · +4 min</text>
<rect x="450" y="140" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="545" y="158" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Trigger maker</text>
<text x="545" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Crux + scheduled</text>

<rect x="40" y="240" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="135" y="258" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Change detector</text>
<text x="135" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">vs last window + normal</text>
<rect x="245" y="240" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">Promoter</text>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Note to trigger rules</text>

<rect x="245" y="340" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#633806">Trigger buffer</text>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Cap, tunable</text>

<rect x="40" y="440" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="135" y="458" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">Stats + cues</text>
<text x="135" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Notes, boards, to UI</text>
<rect x="245" y="440" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340" y="458" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">Cosmos</text>
<text x="340" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Snapshots, triggers</text>
<rect x="450" y="440" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="545" y="458" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#3C3489">triggers hub</text>
<text x="545" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">To the agents</text>
</g>
<g stroke="#73726c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
