<rect x="498" y="352" width="140" height="22" rx="4" fill="#0f1512" stroke="#2a352e"/><text x="506" y="363" dominant-baseline="central" fill="#9aa89f" font-size="11">Why are they so deep?</text>

<rect x="20" y="426" width="640" height="64" rx="8" fill="#161e19" stroke="#2a352e"/>
