<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Viewer screen layout</title>
<desc>Dark broadcast-style viewer screen. Top bar with match, viewer type, club, player, language and playback controls. Live pitch on the left with one highlight, caption bar under it, side panel on the right with momentum, xG race, passing network and Ask the studio, and a timeline across the bottom.</desc>
<rect width="680" height="520" fill="#0f1512"/>
<g font-size="12" fill="#e6ece7">
<rect x="20" y="20" width="640" height="40" rx="8" fill="#161e19" stroke="#2a352e"/>
<rect x="30" y="27" width="90" height="26" rx="4" fill="#1d2721" stroke="#2a352e"/><text x="75" y="40" text-anchor="middle" dominant-baseline="central">Match ▾</text>
<rect x="128" y="27" width="90" height="26" rx="4" fill="#1d2721" stroke="#2a352e"/><text x="173" y="40" text-anchor="middle" dominant-baseline="central">Analyst ▾</text>
<rect x="226" y="27" width="90" height="26" rx="4" fill="#1d2721" stroke="#2a352e"/><text x="271" y="40" text-anchor="middle" dominant-baseline="central">Club ▾</text>
<rect x="324" y="27" width="90" height="26" rx="4" fill="#1d2721" stroke="#2a352e"/><text x="369" y="40" text-anchor="middle" dominant-baseline="central">Player ▾</text>
<rect x="422" y="27" width="70" height="26" rx="4" fill="#1d2721" stroke="#2a352e"/><text x="457" y="40" text-anchor="middle" dominant-baseline="central">EN ▾</text>
<rect x="500" y="27" width="150" height="26" rx="4" fill="#1d2721" stroke="#2a352e"/><text x="575" y="40" text-anchor="middle" dominant-baseline="central">▶  10×  ·  Next moment</text>

<rect x="20" y="76" width="440" height="280" rx="8" fill="#1f5a3a"/>
<g fill="none" stroke="#5fbf8a" stroke-opacity="0.6" stroke-width="1">
<rect x="32" y="88" width="416" height="256"/>
<line x1="240" y1="88" x2="240" y2="344"/>
<circle cx="240" cy="216" r="34"/>
<rect x="32" y="156" width="56" height="120"/>
<rect x="392" y="156" width="56" height="120"/>
</g>
<line x1="140" y1="94" x2="140" y2="338" stroke="#e8a24f" stroke-width="2" stroke-dasharray="6 4"/>
<g stroke="#0f1512" stroke-width="1">
<circle cx="140" cy="120" r="6" fill="#f07167"/><circle cx="140" cy="175" r="6" fill="#f07167"/><circle cx="140" cy="250" r="6" fill="#f07167"/><circle cx="140" cy="310" r="6" fill="#f07167"/>
<circle cx="185" cy="140" r="6" fill="#f07167"/><circle cx="185" cy="216" r="6" fill="#f07167"/><circle cx="185" cy="290" r="6" fill="#f07167"/>
