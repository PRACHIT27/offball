</g>
<circle cx="262" cy="226" r="3" fill="#ffd166"/>
<text x="148" y="104" fill="#e8a24f" font-size="11">Line 26 m</text>

<rect x="20" y="366" width="440" height="44" rx="8" fill="#161e19" stroke="#2a352e"/>
<text x="240" y="388" text-anchor="middle" dominant-baseline="central">Northgate dropped 12 m deeper after the red card.</text>

