<circle cx="485" cy="444" r="6" fill="#f07167"/><text x="485" y="470" text-anchor="middle" dominant-baseline="central" fill="#9aa89f">Red 70'</text>
<circle cx="535" cy="444" r="6" fill="#e8a24f"/><text x="545" y="470" text-anchor="middle" dominant-baseline="central" fill="#9aa89f">Shift 74'</text>
